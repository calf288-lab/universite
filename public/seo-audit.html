<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бесплатный AI-аудит сайта — АГЕНТ24</title>
    <meta name="description" content="Мгновенный SEO-аудит сайта на базе AI. Найдите ошибки, которые мешают расти в Яндексе.">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(255,255,255,0.05);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            font-size: 2.2em;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { font-size: 1.1em; opacity: 0.9; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            margin-bottom: 15px;
            font-family: inherit;
        }
        input:focus { outline: none; border-color: #f5576c; }
        input::placeholder { color: rgba(255,255,255,0.4); }
        button {
            width: 100%;
            padding: 16px;
            font-size: 18px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover:not(:disabled) { transform: translateY(-2px); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .features { margin-top: 40px; padding-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); }
        .feature { margin-bottom: 15px; display: flex; align-items: center; font-size: 15px; }
        .feature-icon { font-size: 22px; margin-right: 12px; }
        #result { margin-top: 30px; display: none; }
        .audit-card {
            background: rgba(255,255,255,0.08);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #f5576c;
        }
        .audit-card h3 { margin-top: 0; color: #f5576c; }
        .tech-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
        .tech-item {
            background: rgba(255,255,255,0.05);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }
        .tech-item .label { opacity: 0.7; font-size: 12px; }
        .tech-item .value { font-weight: bold; margin-top: 4px; }
        .cta-box {
            background: linear-gradient(135deg, rgba(240,147,251,0.15), rgba(245,87,108,0.15));
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-top: 25px;
            border: 2px solid rgba(245,87,108,0.3);
        }
        .cta-box h3 { margin-top: 0; font-size: 1.4em; }
        .cta-box a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 30px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .cta-box a:hover { transform: translateY(-2px); }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #f5576c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { text-align: center; opacity: 0.8; }
        .problem { color: #f5576c; font-weight: bold; }
        .ok { color: #4ade80; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Бесплатный AI-аудит сайта</h1>
        <p class="subtitle">Мгновенный анализ + рекомендации от SEO-эксперта</p>
        
        <form id="auditForm">
            <input type="url" id="siteUrl" placeholder="https://yoursite.ru" required>
            <button type="submit" id="submitBtn">🚀 Получить аудит</button>
        </form>
        
        <div id="result"></div>
        
        <div class="features">
            <div class="feature"><span class="feature-icon">⚡</span><span>Результат за 5 секунд</span></div>
            <div class="feature"><span class="feature-icon">🤖</span><span>AI-анализ на базе 187 экспертных ролей</span></div>
            <div class="feature"><span class="feature-icon">📊</span><span>Технический чек-лист + приоритеты</span></div>
        </div>
    </div>
    
    <script>
        document.getElementById('auditForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const url = document.getElementById('siteUrl').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');
            
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Анализируем...';
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <div class="audit-card">
                    <div class="spinner"></div>
                    <div class="loading-text">Сканируем сайт...</div>
                </div>
            `;
            
            try {
                const response = await fetch('/api/audit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    const t = data.data.technical;
                    
                    const problems = [];
                    if (!t.h1 || t.h1 === 'Не найден') problems.push('❌ Отсутствует H1 заголовок');
                    if (t.titleLength > 70) problems.push('⚠️ Title слишком длинный (' + t.titleLength + ' симв.)');
                    if (t.titleLength < 30) problems.push('⚠️ Title слишком короткий');
                    if (t.descLength < 100) problems.push('⚠️ Description короткий или отсутствует');
                    if (!t.hasViewport) problems.push('❌ Нет мобильной адаптации (viewport)');
                    if (!t.hasSchema) problems.push('❌ Нет микроразметки Schema.org');
                    if (!t.hasCanonical) problems.push('⚠️ Нет canonical URL');
                    
                    let problemsHtml = problems.length > 0 
                        ? '<div style="margin:15px 0"><b>Найдено проблем:</b><br>' + problems.join('<br>') + '</div>'
                        : '<div style="margin:15px 0;color:#4ade80"><b>✅ Критических проблем не найдено!</b></div>';
                    
                    resultDiv.innerHTML = `
                        <div class="audit-card">
                            <h3>📊 Технический анализ: ${url}</h3>
                            <div class="tech-grid">
                                <div class="tech-item">
                                    <div class="label">Title</div>
                                    <div class="value">${t.titleLength > 0 ? t.titleLength + ' симв.' : '❌ Нет'}</div>
                                </div>
                                <div class="tech-item">
                                    <div class="label">Description</div>
                                    <div class="value">${t.descLength > 0 ? t.descLength + ' симв.' : '❌ Нет'}</div>
                                </div>
                                <div class="tech-item">
                                    <div class="label">H1 заголовок</div>
                                    <div class="value ${t.h1 && t.h1 !== 'Не найден' ? 'ok' : 'problem'}">${t.h1 && t.h1 !== 'Не найден' ? '✅ Есть' : '❌ Нет'}</div>
                                </div>
                                <div class="tech-item">
                                    <div class="label">Мобильная адаптация</div>
                                    <div class="value ${t.hasViewport ? 'ok' : 'problem'}">${t.hasViewport ? '✅' : '❌'}</div>
                                </div>
                                <div class="tech-item">
                                    <div class="label">Schema.org</div>
                                    <div class="value ${t.hasSchema ? 'ok' : 'problem'}">${t.hasSchema ? '✅' : '❌'}</div>
                                </div>
                                <div class="tech-item">
                                    <div class="label">Canonical</div>
                                    <div class="value ${t.hasCanonical ? 'ok' : 'problem'}">${t.hasCanonical ? '✅' : '❌'}</div>
                                </div>
                            </div>
                            ${problemsHtml}
                        </div>
                        
                        <div class="cta-box">
                            <h3>🎯 Хотите полный AI-аудит?</h3>
                            <p>Получите детальный отчёт с <b>планом работ на 3 месяца</b>, анализом конкурентов и приоритетами исправлений</p>
                            <p style="opacity:0.8;font-size:0.9em">Бесплатно • В течение 24 часов</p>
                            <a href="https://t.me/agent24ai?text=${encodeURIComponent('Здравствуйте! Хочу полный SEO-аудит для сайта: ' + url)}">
                                💬 Написать в Telegram
                            </a>
                        </div>
                    `;
                } else {
                    throw new Error(data.error || 'Unknown error');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="audit-card">
                        <h3>❌ Ошибка анализа</h3>
                        <p>Не удалось просканировать сайт. Напишите нам: <a href="https://t.me/agent24ai" style="color:#f5576c">@agent24ai</a></p>
                    </div>
                `;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Получить аудит';
            }
        });
    </script>
</body>
</html>

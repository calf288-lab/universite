<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бесплатный AI-аудит сайта — АГЕНТ24</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255,255,255,0.05);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 1.2em;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        input[type="url"] {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        input[type="url"]:focus {
            outline: none;
            border-color: #f5576c;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .features {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .feature {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .feature-icon {
            font-size: 24px;
            margin-right: 15px;
        }
        #result {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            display: none;
        }
        .loading {
            text-align: center;
            padding: 20px;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: #f5576c;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Бесплатный AI-аудит сайта</h1>
        <p class="subtitle">За 5 секунд найду ошибки, которые мешают расти в Яндексе</p>
        
        <form id="auditForm">
            <input type="url" id="siteUrl" placeholder="https://yoursite.ru" required>
            <button type="submit" id="submitBtn">🚀 Получить аудит</button>
        </form>
        
        <div id="result"></div>
        
        <div class="features">
            <div class="feature">
                <span class="feature-icon">⚡</span>
                <span>Мгновенный анализ за 5 секунд</span>
            </div>
            <div class="feature">
                <span class="feature-icon">🤖</span>
                <span>AI на базе 187 экспертных ролей</span>
            </div>
            <div class="feature">
                <span class="feature-icon">📊</span>
                <span>Конкретные рекомендации по исправлению</span>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('auditForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const url = document.getElementById('siteUrl').value;
            const submitBtn = document.getElementById('submitBtn');
            const resultDiv = document.getElementById('result');
            
            // Показываем загрузку
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Анализируем...';
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Анализируем сайт...</p>
                </div>
            `;
            
            try {
                const response = await fetch('/api/audit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    resultDiv.innerHTML = `
                        <h3>✅ Заявка отправлена!</h3>
                        <p><strong>Сайт:</strong> ${url}</p>
                        <p><strong>Title:</strong> ${data.data.title}</p>
                        <p><strong>Description:</strong> ${data.data.description}</p>
                        <p><strong>H1:</strong> ${data.data.h1}</p>
                        <hr style="margin: 20px 0; border-color: rgba(255,255,255,0.2);">
                        <p>Мы проанализируем сайт и свяжемся с вами в течение 15 минут с полным AI-аудитом.</p>
                    `;
                } else {
                    throw new Error(data.error || 'Unknown error');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>❌ Ошибка</h3>
                    <p>Произошла ошибка при анализе сайта. Попробуйте позже или напишите нам напрямую: <a href="https://t.me/agent24ai" style="color: #f5576c;">@agent24ai</a></p>
                `;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Получить аудит';
            }
        });
    </script>
</body>
</html>
